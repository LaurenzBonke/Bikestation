<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Live-Belegung der Smart Bikestation: freie Stellplätze, Sensorwerte und Meldungen." />
    <title>Smart Bikestation</title>
    <script>
      // Gespeicherte Darstellung sofort setzen, damit beim Laden nicht kurz der helle Modus aufblitzt
      try {
        var theme = localStorage.getItem('bikestation-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
