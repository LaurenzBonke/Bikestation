# Konfiguration des Bikestation-Agenten. Nach config.ini kopieren und anpassen.
# config.ini steht in .gitignore, weil sie den API-Key enthält.

[api]
# Adresse des Servers mit der C#-API (Dashboard-Server auf dem Laptop bzw. später der Pi selbst)
url = http://192.168.1.198:8080
# Muss Devices:ApiKey des Servers entsprechen (siehe Bikestation-Server-Info.txt, Punkt 2)
api_key = HIER-API-KEY-EINTRAGEN

[agent]
# Messintervall in Sekunden
interval_s = 1.0

# Eine Sektion pro Box. GPIO-Nummern = BCM-Nummern (nicht die physischen Pin-Nummern!).
# ANNAHME: Beispiel-Pins – an eure Verdrahtung anpassen.
[box1]
slot_id = 1
# grove = Grove Ultrasonic Ranger (ein SIG-Pin), hcsr04 = getrennte Trig/Echo-Pins
sensor = grove
sig_pin = 17
# trigger_pin = 23
# echo_pin = 24
servo_pin = 18
# Winkel in Grad für "offen" und "zu" – am Modell ausprobieren
servo_open_angle = 90
servo_closed_angle = 0
# Optional: Vibrationssensor (leer lassen, wenn keiner angeschlossen ist)
vibration_pin =
vibration_active_high = true
